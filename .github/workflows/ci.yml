name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      # The runner's preinstalled `yarn` is Yarn Classic (1.x), not the
      # Yarn 4 (Berry) this project uses (see "packageManager" in
      # package.json). corepack reads that field and shims `yarn` to the
      # right version — without it, Classic mis-resolves the Berry lockfile
      # (e.g. 404s fetching rolldown, which Berry stores differently).
      - name: Enable corepack (Yarn Berry)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Build (type-check + bundle)
        run: yarn build

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Deploy to Vercel
        run: |
          npx vercel@latest pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          npx vercel@latest build --prod --token=${{ secrets.VERCEL_TOKEN }}
          npx vercel@latest deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
